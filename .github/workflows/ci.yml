name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement requirements.lock

      - name: Reject committed credentials
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.session(-journal)?)$'; then
            echo "Tracked runtime credential detected"
            exit 1
          fi
          if git grep -IlE '[0-9]{8,10}:[A-Za-z0-9_-]{30,}' -- .; then
            echo "Telegram bot token pattern detected"
            exit 1
          fi
          if git grep -IlE 'mongodb(\+srv)?://[^/@[:space:]]+:[^/@[:space:]]+@' -- .; then
            echo "MongoDB credentials detected"
            exit 1
          fi

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          bot.py Script.py utils.py EbookGuy database plugins tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  container:
    name: Build production image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag filtering-bot:ci .
